---
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'coliff/bootstrap-show-password-toggle' }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Verify release tag matches package version
        if: ${{ github.event_name == 'release' }}
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_NAME" != "$PACKAGE_VERSION" ] && [ "$TAG_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag '$TAG_NAME' does not match package version '$PACKAGE_VERSION'."
            exit 1
          fi

      - name: Install dependencies
        run: npm install --ignore-scripts --no-package-lock

      - name: Run tests
        run: npm test

      - name: Build package assets
        run: npm run build

      - name: Verify generated files are committed
        run: git diff --exit-code -- css js scss package.json

      - name: Pack npm tarball
        run: npm pack --json > npm-pack.json

      - name: Upload npm tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: |
            *.tgz
            npm-pack.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download npm tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing (OIDC) requires npm 11.5.1 or later
      - name: Update npm
        run: npm install -g npm@11 # zizmor: ignore[adhoc-packages] npm itself must be upgraded for OIDC publishing

      - name: Publish to npm
        working-directory: dist
        run: npm publish --provenance "$(node -p 'require("./npm-pack.json")[0].filename')"
